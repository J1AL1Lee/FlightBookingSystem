<script>
    $(document).ready(function(){
        var orderId = getOrderId();
        $.ajax({
            url: "get_order_info.php",
            type: "POST",
            data: {orderId: orderId},
            success: function(data){
                var orderInfo = JSON.parse(data);
                console.log(orderInfo);
                $("#order-id").text(orderInfo.orderId);
                $("#order-date").text(orderInfo.orderDate);
                $("#order-status").text(orderInfo.orderStatus);
                $("#order-price").text(orderInfo.orderPrice);
                $("#order-flight").text(orderInfo.flightNumber);
                $("#order-from").text(orderInfo.fromCity);
                $("#order-to").text(orderInfo.toCity);
                $("#order-passengers").text(orderInfo.passengers);
                $("#order-seat").text(orderInfo.seatType);
                $("#order-baggage").text(orderInfo.baggage);
                $("#order-contact").text(orderInfo.contact);

                // 生成随机座位号
                var seatNumber = generateSeatNumber();
                $("#order-seat-number").text(seatNumber);
            }
        });
    });

    function generateSeatNumber() {
        var letters = 'ABCDEF';
        var letter = letters[Math.floor(Math.random() * letters.length)];
        var number = Math.floor(100 * Math.random()).toString().padStart(2, '0');
        return letter + number;
    }

    function getOrderId() {
        // 假设订单ID通过URL参数传递
        var urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('orderId');
    }
</script>
