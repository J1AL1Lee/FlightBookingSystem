<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>支付页面</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        .payment-container { max-width: 600px; margin: 50px auto; text-align: center; }
        .qr-code { border: 1px solid #ddd; padding: 10px; }
        .spinner { display: none; }
    </style>
</head>
<body>
<div class="container payment-container">
    <h1>支付订单</h1>
    <div id="payment-content">
        <p>请发起支付以继续...</p>
        <button id="pay-btn" class="btn btn-primary">发起支付</button>
    </div>
    <div id="payment-result" class="mt-4" style="display: none;">
        <p id="order-info"></p>
        <div id="qr-code" class="qr-code"></div>
        <p id="status-message"></p>
        <div id="spinner" class="spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
        </div>
    </div>
</div>

<script src="js/jquery.min.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function() {
        $('#pay-btn').click(function() {
            $('#payment-content').hide();
            $('#payment-result').show();
            $('#spinner').show();

            $.ajax({
                url: '/api/payments/create',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    orderId: "202507020001", // 动态生成或从上一页面传递
                    amount: 10.50
                }),
                success: function(response) {
                    $('#payment-result').html(response);
                    $('#spinner').hide();
                },
                error: function(xhr) {
                    $('#payment-result').html('<p class="text-danger">支付发起失败: ' + xhr.responseJSON.message + '</p>');
                    $('#spinner').hide();
                    $('#payment-content').show();
                }
            });
        });

        // 自动刷新支付状态
        function checkPaymentStatus(payId) {
            if (!payId) return;

            $.get(`/api/payments/status?payId=${payId}`, function(data) {
                if (data.status === 'TRADE_SUCCESS') {
                    alert('支付成功！');
                    window.location.href = '/personal.html';
                } else if (data.status) {
                    $('#status-message').text('当前状态: ' + data.status + '，继续等待...');
                }
            }).fail(function() {
                $('#status-message').text('状态查询失败，请重试。');
            });
        }

        // 监听页面加载后的状态检查
        $(document).ajaxStop(function() {
            const payIdMatch = $('#payment-result a[href*="/api/payments/status"]').attr('href');
            if (payIdMatch) {
                const payId = payIdMatch.split('payId=')[1];
                setInterval(() => checkPaymentStatus(payId), 5000); // 每5秒检查一次
            }
        });
    });
</script>
</body>
</html>
